<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Precision instrument outer ring and chassis -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="#0c121b" stroke="#253549" stroke-width="1.5" />
  <!-- Corner coordinate ticks -->
  <path d="M6 10H8V6M40 6V8H42M42 38H40V42M8 42V40H6" stroke="#486282" stroke-width="1.2" stroke-linecap="round" />
  <!-- 3x3 Board Grid Matrix -->
  <!-- Row 0 -->
  <rect x="10" y="10" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <rect x="20" y="10" width="8" height="8" rx="2" fill="#142c38" stroke="#1f5862" stroke-width="1" />
  <rect x="30" y="10" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <!-- Row 1 -->
  <rect x="10" y="20" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <rect x="20" y="20" width="8" height="8" rx="2" fill="#142c38" stroke="#1f5862" stroke-width="1" />
  <rect x="30" y="20" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <!-- Row 2 -->
  <rect x="10" y="30" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <rect x="20" y="30" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />
  <rect x="30" y="30" width="8" height="8" rx="2" fill="#182332" stroke="#2c3e55" stroke-width="1" />

  <!-- Compiled Transition Vector (Orthogonal Path from (0,0) to (0,1) to (1,1)) -->
  <path d="M14 14H24V24" stroke="#2dd4bf" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 2.5" />
  <circle cx="24" cy="14" r="1.5" fill="#2dd4bf" />
  <circle cx="24" cy="24" r="1.5" fill="#2dd4bf" />

  <!-- Player A (Cell 0: top-left) - Gold / Ochre Triangle Marker -->
  <polygon points="14,11.5 17.5,16.5 10.5,16.5" fill="#f59e0b" stroke="#fde68a" stroke-width="0.75" />

  <!-- Player B (Cell 8: bottom-right) - Cobalt / Cyan Circular Orb Marker -->
  <circle cx="34" cy="34" r="3" fill="#0ea5e9" stroke="#bae6fd" stroke-width="0.8" />
</svg>
